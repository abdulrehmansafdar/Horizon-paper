<header class="bg-primary-900/95 backdrop-blur-md text-white py-3 sticky top-0 z-50 shadow-lg border-b border-white/5">
  <div class="container-custom px-4">
    <div class="flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center gap-3">
        <div class="h-12 w-12 rounded-lg overflow-hidden bg-white p-1">
          <img src="/assets/Horizon.webp" alt="Horizon Paper" class="w-full h-full object-cover rounded">
        </div>
        <div>
          <h1 class="md:text-xl text-sm font-serif font-bold tracking-wide">Horizon Paper & Board Mills</h1>
          <p class="md:text-xs text-[10px] text-white/60 tracking-wider">EST. 2009</p>
        </div>
      </div>

      <!-- Desktop Navigation -->
      <nav class="hidden lg:flex items-center gap-8">
        <a *ngFor="let item of navItems" (click)="ScrollToSection(item.href)" [href]="'#' + item.href"
          class="text-sm font-medium text-white/80 hover:text-blue-400 transition-colors cursor-pointer relative group">
          {{ item.label }}
          <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-400 transition-all duration-300 group-hover:w-full"></span>
        </a>
      </nav>

      <!-- CTA Button -->
      <div class="hidden lg:block">
        <button (click)="ScrollToSection('contact')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2.5 px-5 rounded-md transition-all duration-300 hover:shadow-lg hover:shadow-blue-500/25">
          Get Quote
        </button>
      </div>

      <!-- Mobile Menu Button -->
      <button class="lg:hidden text-white p-2 hover:bg-white/10 rounded-lg transition-colors" (click)="toggleMobileMenu()" title="Open Menu" aria-label="Open Menu">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu - Slide from right -->
  <div
    class="fixed inset-y-0 right-0 w-80 bg-primary-900 shadow-2xl transform transition-all duration-300 ease-in-out lg:hidden z-50"
    [ngClass]="{'translate-x-0': isMobileMenuOpen, 'translate-x-full': !isMobileMenuOpen}">

    <!-- Menu Header -->
    <div class="flex items-center justify-between p-5 border-b border-white/10">
      <h2 class="text-lg font-semibold text-white">Menu</h2>
      <button class="p-2 text-white/60 hover:text-white hover:bg-white/10 rounded-lg transition-colors" title="Close Menu" aria-label="Close Menu"
        (click)="closeMobileMenu()">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Menu Items -->
    <nav class="p-4 overflow-y-auto">
      <div class="space-y-1">
        <a *ngFor="let item of navItems" (click)="ScrollToSection(item.href)" [href]="'#' + item.href"
          class="flex items-center justify-between w-full p-4 text-white/80 hover:bg-white/5 hover:text-blue-400 rounded-lg transition-all duration-200 cursor-pointer">
          <span class="font-medium">{{ item.label }}</span>
          <svg class="w-4 h-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </a>
      </div>

      <!-- Mobile CTA -->
      <div class="mt-6 p-4">
        <button (click)="ScrollToSection('contact')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-5 rounded-lg transition-all duration-300">
          Get Free Quote
        </button>
      </div>
    </nav>
  </div>

  <!-- Overlay -->
  <div *ngIf="isMobileMenuOpen"
    class="fixed inset-0 bg-black/70 backdrop-blur-sm lg:hidden z-40"
    (click)="closeMobileMenu()">
  </div>
</header>
