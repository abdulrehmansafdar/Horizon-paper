<section class="section-padding bg-primary-900 text-white relative overflow-hidden">
  <!-- Background Pattern -->
  <div class="absolute inset-0 opacity-5">
    <div class="absolute top-0 left-0 w-full h-full" style="background-image: url('data:image/svg+xml,%3Csvg width=&quot;60&quot; height=&quot;60&quot; viewBox=&quot;0 0 60 60&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;%3E%3Cg fill=&quot;none&quot; fill-rule=&quot;evenodd&quot;%3E%3Cg fill=&quot;%23ffffff&quot; fill-opacity=&quot;1&quot;%3E%3Cpath d=&quot;M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z&quot;/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
  </div>

  <div class="container-custom relative z-10">
    <!-- Section Header -->
    <div class="text-center mb-16">
      <span class="inline-block text-blue-400 font-semibold text-sm tracking-wider uppercase mb-3">Why Choose Us</span>
      <h2 class="text-3xl md:text-4xl lg:text-5xl font-serif mb-6">Excellence in Every Sheet</h2>
      <p class="text-white/70 text-lg max-w-3xl mx-auto">
        With over 15 years of experience, Horizon Paper & Board Mills has established itself as a trusted partner for businesses across Pakistan.
      </p>
    </div>

    <!-- Factory Image -->
    <div class="mb-12 rounded-2xl overflow-hidden">
      <img src="assets/eggtray.jpeg" alt="Egg Tray Production" class="w-full h-64 object-cover opacity-80">
    </div>

    <!-- Features Grid -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 mb-16">
        <div
          *ngFor="let feature of features; let i = index"
          class="group p-8 rounded-2xl bg-white/5 border border-white/10 hover:border-blue-500/50 hover:bg-white/10 transition-all duration-300"
        >
          <div class="w-14 h-14 rounded-xl bg-blue-600/20 flex items-center justify-center text-blue-400 mb-5 group-hover:scale-110 transition-transform duration-300" [innerHTML]="feature.icon">
          </div>
        <h3 class="text-xl font-serif font-semibold mb-3 text-white">{{ feature.title }}</h3>
        <p class="text-white/60 text-sm leading-relaxed">{{ feature.description }}</p>
      </div>
    </div>

    <!-- Certifications -->
    <div class="border-t border-white/10 pt-12">
      <div class="text-center mb-8">
        <p class="text-white/50 text-sm font-medium uppercase tracking-wider mb-4">Trusted & Certified</p>
      </div>
      <div class="flex flex-wrap justify-center gap-8">
        <div *ngFor="let cert of certifications" class="flex items-center gap-3 px-6 py-3 rounded-full bg-white/5 border border-white/10">
          <div class="w-3 h-3 rounded-full bg-blue-400"></div>
          <div>
            <p class="font-semibold text-white">{{ cert.name }}</p>
            <p class="text-xs text-white/50">{{ cert.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
