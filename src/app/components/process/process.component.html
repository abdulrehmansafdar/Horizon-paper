<section id="process" class="section-padding bg-paper-50">
  <div class="container-custom">
    <!-- Header Section -->
    <div class="text-center mb-16">
        <span class="inline-block text-blue-600 font-semibold text-sm tracking-wider uppercase mb-3">Our Process</span>
      <h2 class="section-title">Manufacturing Excellence</h2>
      <p class="section-subtitle mx-auto">
        Our state-of-the-art manufacturing process ensures consistent quality and efficiency at every step,
        delivering excellence through innovation and precision.
      </p>
    </div>

    <!-- Carousel Container -->
    <div class="relative max-w-7xl mx-auto" role="region" aria-roledescription="carousel" aria-label="Manufacturing steps carousel">
      <!-- Carousel Wrapper -->
      <div class="overflow-hidden rounded-2xl">
        <div class="flex transition-transform duration-500 ease-in-out" 
             [style.transform]="'translateX(-' + (currentSlide * slideWidth) + '%)'">
          
          <!-- Process Cards -->
          <div *ngFor="let process of manufacturingProcess; let i = index" 
               class="flex-shrink-0 px-3"
               [style.width.%]="slideWidth">
<div class="group relative bg-white rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-500 border border-primary-100 overflow-hidden h-full">
               
               <!-- Enhanced Step Number Badge -->
               <div class="absolute -top-2 -right-2 z-20">
                 <div class="relative">
                    <div class="absolute inset-0 w-16 h-16 bg-gradient-to-br from-blue-400 to-blue-600 rounded-full opacity-30 scale-110 animate-pulse"></div>

                    <div class="relative w-16 h-16 bg-gradient-to-br from-blue-500 via-blue-600 to-blue-700 rounded-full flex items-center justify-center shadow-xl border-4 border-white group-hover:scale-110 transition-transform duration-300">
                      <div class="absolute inset-1 bg-gradient-to-br from-blue-400 to-transparent rounded-full opacity-40"></div>

                      <span class="relative text-white font-bold text-lg font-mono tracking-wider drop-shadow-lg">
                        {{ process.step.toString().padStart(2, '0') }}
                      </span>

                      <div class="absolute -top-1 -right-1 w-3 h-3 bg-yellow-400 rounded-full opacity-80 group-hover:opacity-100 transition-opacity duration-300"></div>
                      <div class="absolute -bottom-1 -left-1 w-2 h-2 bg-blue-300 rounded-full opacity-60 group-hover:opacity-100 transition-opacity duration-300"></div>
                   </div>
                 </div>
               </div>

               <div class="p-8 pt-12">
                 <div class="relative mb-6">
                    <div class="w-20 h-20 bg-gradient-to-br from-blue-500 via-blue-600 to-blue-700 rounded-2xl flex items-center justify-center mx-auto shadow-xl group-hover:scale-110 transition-transform duration-300">
                     <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="process.iconPath"></path>
                     </svg>
                   </div>
                      <div class="absolute inset-0 w-20 h-20 mx-auto rounded-2xl border-2 border-blue-200 scale-125 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                 </div>

                 <div class="text-center">
                  <h3 class="text-xl font-bold text-primary-900 mb-3 group-hover:text-blue-600 transition-colors duration-300">
                      {{ process.title }}
                    </h3>
                   <p class="text-primary-600 leading-relaxed text-sm">
                     {{ process.desc }}
                   </p>
                 </div>

                 <div class="mt-6 flex justify-center">
                   <div class="w-full bg-primary-100 rounded-full h-2 relative overflow-hidden">
                      <div class="bg-gradient-to-r from-blue-500 via-blue-600 to-blue-700 h-2 rounded-full transition-all duration-1000 relative overflow-hidden"
                           [style.width.%]="(process.step / manufacturingProcess.length) * 100">
                       <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white to-transparent opacity-30 transform -skew-x-12 animate-pulse"></div>
                     </div>
                   </div>
                 </div>
               </div>
             </div>
          </div>
        </div>
      </div>

      <!-- Navigation Buttons -->
      <button *ngIf="currentSlide > 0" title="Previous Slide" aria-label="Previous Slide"
              (click)="prevSlide()"
               class="absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 bg-white rounded-full shadow-lg border border-primary-100 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-all duration-300 z-10">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>

      <button *ngIf="currentSlide < maxSlides - 1" title="Next Slide" aria-label="Next Slide"
              (click)="nextSlide()"
               class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 bg-white rounded-full shadow-lg border border-primary-100 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-all duration-300 z-10">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>

    <!-- Enhanced Dot Indicators -->
    <div class="flex justify-center mt-8 space-x-3">
      <button *ngFor="let slide of slides; let i = index" title="Go to step" aria-label="Go to step"
              (click)="goToSlide(i)"
              class="relative w-4 h-4 rounded-full transition-all duration-300 group"
               [class.bg-blue-600]="i === currentSlide"
               [class.bg-primary-200]="i !== currentSlide"
              [class.scale-125]="i === currentSlide">
         <div *ngIf="i === currentSlide"
              class="absolute inset-0 bg-blue-400 rounded-full scale-150 opacity-30 animate-pulse"></div>
        
        <div class="absolute -top-8 left-1/2 transform -translate-x-1/2 bg-primary-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap">
          Step {{ i + 1 }}
        </div>
      </button>
    </div>
  </div>
</section>
